[build]
  # Build command for the frontend
  command = "cd frontend && npm install && npm run build"
  # Directory to publish (frontend build output)
  publish = "frontend/dist"
  # Base directory for the build
  base = "."

[build.environment]
  # Node.js version (LTS)
  NODE_VERSION = "20"
  # Enable legacy peer deps for compatibility
  NPM_FLAGS = "--legacy-peer-deps"
  # Increase memory limit for large builds
  NODE_OPTIONS = "--max-old-space-size=4096"

# Netlify Functions for backend API
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirects for SPA routing and API proxying
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and CORS
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Environment variables (will be set in Netlify dashboard)
[context.production.environment]
  NODE_ENV = "production"
  
[context.deploy-preview.environment]
  NODE_ENV = "development"
