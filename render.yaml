services:
  # Backend API Service
  - type: web
    name: finautojobs-backend
    runtime: node
    plan: starter
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      # All environment variables must be set manually in Render dashboard
      # See deployment documentation for required variables
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    
  # Frontend Static Site
  - type: web
    name: finautojobs-frontend
    runtime: static
    plan: starter
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # All environment variables must be set manually in Render dashboard
      # See deployment documentation for required variables
      - key: NODE_ENV
        value: production

# Database: Using MongoDB Atlas (configured via environment variables)
# No Render database service needed
