services:
  # Full-Stack MERN Application (Single Service)
  - type: web
    name: finautojobs-fullstack
    runtime: node
    plan: starter
    buildCommand: |
      # Install backend dependencies
      cd backend && npm install
      # Install frontend dependencies and build with production config
      cd ../frontend
      npm install
      # Set environment variables for build
      export VITE_API_URL="/api"
      export VITE_APP_URL="https://finautojobs-fullstack.onrender.com"
      npm run build
      # Frontend build is in frontend/dist, backend will serve it directly
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      # All environment variables must be set manually in Render dashboard
      # See deployment documentation for required variables
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

# Database: Using MongoDB Atlas (configured via environment variables)
# No Render database service needed
