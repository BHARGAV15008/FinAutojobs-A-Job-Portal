<!DOCTYPE html>
<html>
<head>
    <title>Clear Frontend Storage</title>
</head>
<body>
    <h1>Clearing Frontend Storage...</h1>
    <div id="status">Processing...</div>
    
    <script>
        // Clear all localStorage
        localStorage.clear();
        
        // Clear all sessionStorage
        sessionStorage.clear();
        
        // Clear all cookies for this domain
        document.cookie.split(";").forEach(function(c) { 
            document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
        });
        
        // Clear IndexedDB if it exists
        if ('indexedDB' in window) {
            indexedDB.databases().then(databases => {
                databases.forEach(db => {
                    indexedDB.deleteDatabase(db.name);
                });
            });
        }
        
        document.getElementById('status').innerHTML = `
            <h2>✅ Frontend Storage Cleared Successfully!</h2>
            <ul>
                <li>✅ localStorage cleared</li>
                <li>✅ sessionStorage cleared</li>
                <li>✅ Cookies cleared</li>
                <li>✅ IndexedDB cleared</li>
            </ul>
            <p><strong>You can now close this tab and refresh your application.</strong></p>
        `;
        
        console.log('🎉 All frontend storage cleared!');
    </script>
</body>
</html>
