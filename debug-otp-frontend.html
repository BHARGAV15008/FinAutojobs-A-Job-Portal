<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Debug Test</title>
</head>
<body>
    <h1>OTP Frontend Debug Test</h1>
    
    <div>
        <h2>Send Email OTP</h2>
        <input type="email" id="email" placeholder="Enter email" value="test@example.com">
        <button onclick="sendEmailOTP()">Send Email OTP</button>
    </div>
    
    <div>
        <h2>Send SMS OTP</h2>
        <input type="tel" id="phone" placeholder="Enter phone" value="+1234567890">
        <button onclick="sendSMSOTP()">Send SMS OTP</button>
    </div>
    
    <div id="result"></div>

    <script>
        async function sendEmailOTP() {
            const email = document.getElementById('email').value;
            const resultDiv = document.getElementById('result');
            
            console.log('🚀 Sending email OTP to:', email);
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/send-otp-email', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email }),
                });
                
                console.log('📡 Response status:', response.status);
                console.log('📡 Response headers:', response.headers);
                
                const data = await response.json();
                console.log('📨 Response data:', data);
                
                resultDiv.innerHTML = `<h3>Email OTP Result:</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
                
            } catch (error) {
                console.error('❌ Error:', error);
                resultDiv.innerHTML = `<h3>Error:</h3><pre>${error.message}</pre>`;
            }
        }
        
        async function sendSMSOTP() {
            const phone = document.getElementById('phone').value;
            const resultDiv = document.getElementById('result');
            
            console.log('🚀 Sending SMS OTP to:', phone);
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/send-otp-sms', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ phone }),
                });
                
                console.log('📡 Response status:', response.status);
                console.log('📡 Response headers:', response.headers);
                
                const data = await response.json();
                console.log('📨 Response data:', data);
                
                resultDiv.innerHTML = `<h3>SMS OTP Result:</h3><pre>${JSON.stringify(data, null, 2)}</pre>`;
                
            } catch (error) {
                console.error('❌ Error:', error);
                resultDiv.innerHTML = `<h3>Error:</h3><pre>${error.message}</pre>`;
            }
        }
    </script>
</body>
</html>
