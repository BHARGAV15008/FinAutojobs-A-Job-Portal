services:
  - type: web
    name: finautojobs-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        value: ${MONGODB_URI}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: SESSION_SECRET
        value: ${SESSION_SECRET}
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        value: ${EMAIL_USER}
      - key: EMAIL_PASS
        value: ${EMAIL_PASS}
      - key: EMAIL_FROM_NAME
        value: FinAutoJobs
      - key: EMAIL_FROM_ADDRESS
        value: ${EMAIL_FROM_ADDRESS}
      - key: GOOGLE_CLIENT_ID
        value: ${GOOGLE_CLIENT_ID}
      - key: GOOGLE_CLIENT_SECRET
        value: ${GOOGLE_CLIENT_SECRET}
      - key: FRONTEND_URL
        value: https://finautojobs-frontend.onrender.com
    healthCheckPath: /api/health
    repo: https://github.com/BHARGAV15008/FinAutojobs-A-Job-Portal.git
    branch: beta
    rootDir: backend
