services:
  - type: web
    name: finautojobs-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        value: finautojobs-jwt-secret-key-2024-production-change-this
      - key: SESSION_SECRET
        value: finautojobs-session-secret-key-2024-production-change-this
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        value: hiddenshadow032025@gmail.com
      - key: EMAIL_PASS
        value: rxdn afad anzi obxx
      - key: EMAIL_FROM_NAME
        value: FinAutoJobs
      - key: EMAIL_FROM_ADDRESS
        value: hiddenshadow032025@gmail.com
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: UPLOAD_PATH
        value: ./uploads
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: WEBSOCKET_ENABLED
        value: true
      - key: OTP_EXPIRY_MINUTES
        value: 10
      - key: OTP_LENGTH
        value: 6
      - key: OTP_ENABLED
        value: true

databases:
  - name: finautojobs-mongodb
    plan: free
