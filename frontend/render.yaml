services:
  - type: web
    name: finautojobs-frontend
    env: static
    plan: free
    buildCommand: ./render-deploy.sh
    publishPath: build
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: X-XSS-Protection
        value: "1; mode=block"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://finautojobs-a-job-portal-w714.onrender.com/api
      - key: VITE_APP_NAME
        value: FinAutoJobs
      - key: VITE_NODE_ENV
        value: production
      - key: VITE_ENABLE_REAL_TIME_NOTIFICATIONS
        value: "true"
      - key: VITE_ENABLE_FILE_UPLOADS
        value: "true"
      - key: VITE_ENABLE_SOCIAL_LOGIN
        value: "false"
      - key: VITE_ENABLE_PREMIUM_FEATURES
        value: "false"
      # TODO: Update these values in your Render dashboard
      - key: VITE_SMTP_HOST
        value: smtp.gmail.com
      - key: VITE_SMTP_PORT
        value: 587
      - key: VITE_SMTP_USER
        value: hiddenshadow032025@gmail.com
      - key: VITE_SMTP_PASS
        value: rxdn afad anzi obxx
    repo: https://github.com/BHARGAV15008/FinAutojobs-A-Job-Portal.git
    branch: beta
    rootDir: frontend
