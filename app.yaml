# Google App Engine / Cloud Run configuration
runtime: nodejs18

# Build configuration
build:
  - name: Install Dependencies
    command: npm install

  - name: Build Frontend
    command: npm run build

# Deployment configuration
handlers:
  # API routes
  - url: /api/.*
    script: auto
    secure: always

  # Static frontend files
  - url: /
    static_dir: frontend/dist
    upload: frontend/dist/.*
    secure: always

  - url: /.*
    static_files: frontend/dist/index.html
    upload: frontend/dist/index.html
    secure: always

# Environment variables
env_variables:
  NODE_ENV: "production"
  PORT: "8080"

# Automatic scaling
automatic_scaling:
  min_instances: 1
  max_instances: 10
  target_cpu_utilization: 0.65
